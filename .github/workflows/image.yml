name: image

# main 每次提交、打 v* 标签、或手动触发时，构建 linux/amd64 + linux/arm64
# 镜像并推到 GitHub Container Registry：
#   ghcr.io/jsxiojun/new-api-usdt:latest
#   ghcr.io/jsxiojun/new-api-usdt:v0.1.0
#   ghcr.io/jsxiojun/new-api-usdt:sha-<commit 前 7 位>
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # 必须全小写：Docker 的镜像名规范不接受大写，而 ${{ github.repository }}
          # 在用户名含大写时会保留大小写（JSXiaoJun/...），Docker 无法引用。
          # 注意是小写 jsxiaojun（JSXiaoJun 去掉大写），别写成 jsxiojun。
          images: ghcr.io/jsxiaojun/new-api-usdt
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 防止再出现"镜像里少了某个二进制"的情况：构建完直接把镜像拉下来检查。
      - name: verify binaries
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="main"; fi
          echo "checking $IMAGE:$TAG"
          docker run --rm --entrypoint sh "$IMAGE:$TAG" -c 'ls -l /usr/local/bin'
          docker run --rm --entrypoint sh "$IMAGE:$TAG" -c 'test -x /usr/local/bin/usdt-scanner && test -x /usr/local/bin/usdt-deploy && test -x /usr/local/bin/usdt-notify'