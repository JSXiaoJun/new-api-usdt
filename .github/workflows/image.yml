name: image

# main 每次提交、打 v* 标签、或手动触发时，构建 linux/amd64 + linux/arm64
# 镜像并推到 GitHub Container Registry：
#   ghcr.io/jsxiojun/new-api-usdt:latest
#   ghcr.io/jsxiojun/new-api-usdt:v0.1.0
#   ghcr.io/jsxiojun/new-api-usdt:sha-<commit 前 7 位>
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # 坑：GitHub 用户名含大写（JSXiaoJun）时，GHCR 把包存在
          # ghcr.io/JSXiaoJun/new-api-usdt 下，而 Docker 的镜像名规范只允许小写，
          # 写死小写去推送又会报 `not_found: owner not found`。
          # 结论：这个账号的 GHCR 镜像无法被 `docker pull` 引用，部署请用
          # Release 里的部署包（见 README），镜像仅作归档。
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
