services:
  usdt-scanner:
    # 直接拉 GitHub 上 CI 构建好的镜像，服务器不需要源码、不需要 Go。
    # 必须全小写：jsxiaojun（用户名 JSXiaoJun 的小写形式）。
    image: ghcr.io/jsxiaojun/new-api-usdt:latest
    container_name: usdt-scanner
    restart: unless-stopped
    env_file: .env
    volumes:
      # 容器以 uid 10001 运行：首次启动前执行
      #   mkdir -p data && chown -R 10001:10001 data
      - ./data:/data
    # 只出站，不对外暴露端口。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
